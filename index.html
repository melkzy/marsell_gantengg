<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.0.0/animate.min.css" />
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" type="image/x-icon" href="./img/hbd.png">
  <title>Happy Birthday!</title>
</head>

<body>
  <audio id="background-music" src="./music/monokrom.mp3" preload="auto"></audio>

  <div class="bg" id="content">

    <div class="container" id="timer">
      <h5>Countdown to <x id='name'></x> birthday :</h5>
      <ul>
        <li><span id="days"></span>days</li>
        <li><span id="hours"></span>Hours</li>
        <li><span id="minutes"></span>Minutes</li>
        <li><span id="seconds"></span>Seconds</li>
      </ul>
    </div>

    <div id="slideSatu" class="animate__animated animate__slideInDown animate__slow d-none">
      <img src="./img/hbd1.png" class="img">
    </div>

    <div id="slideDua" class="slides d-none paper animate__zoomInDown animate__animated animate__delay-2s animate__slow">
      <div class="paper-content">
        <p id="teks1" class="teks"></p>
      </div>
    </div>

    <div id="slideTiga" class="slides d-none paper animate__fadeInRight animate__animated">
      <div class="paper-content">
        <p id="teks2" class="teks"></p>
      </div>
    </div>

    <div class="kotak d-none slides animate__animated animate__fadeInDown animate__delay-2s" id="slideEmpat">
      <div class="row">
        <div class="col-sm mt-1">
          <h5>Kamuu sukaa enggaa? </h5>
        </div>
      </div>
      <div class="row mt-2">
        <div class="col-4 offset-2">
          <button id="gaa" class="btn btn-outline-danger"> gaa! </button>
        </div>
        <div class="col-4">
          <button id="sukaa" class="btn btn-outline-info"> sukaa!! </button>
        </div>
      </div>
    </div>

    <div id="slideLima" class="d-none animate__bounceIn animate__animated animate__slow">
      <i class="fas fa-heart fa-5x text-danger"></i>
    </div>
    <p id="trims" class="text-muted d-none mt-2"></p>

    <!-- SLIDE ENAM - GALERI FOTO -->
    <div id="slideEnam" class="d-none">
      <div class="gallery-container animate__animated animate__fadeInUp animate__slow">
        <h3 class="gallery-title">🌸 Kenangan Bersama 🌸</h3>
        <div class="gallery-grid">
          <div class="gallery-item">
            <img src="./img/p1.jpg" alt="Photo 1" class="gallery-img" onerror="this.src='https://via.placeholder.com/200x200/FFB6C1/FFFFFF?text=❤️'">
            <p class="photo-note">alifaa kecilll💕</p>
          </div>
          <div class="gallery-item">
            <img src="./img/p2.jpg" alt="Photo 2" class="gallery-img" onerror="this.src='https://via.placeholder.com/200x200/FF69B4/FFFFFF?text=💕'">
            <p class="photo-note">marsell kecilll💕</p>
          </div>
          <div class="gallery-item">
            <img src="./img/p3.jpg" alt="Photo 3" class="gallery-img" onerror="this.src='https://via.placeholder.com/200x200/FF1493/FFFFFF?text=✨'">
            <p class="photo-note">pap pertamaa </p>
          </div>
          <div class="gallery-item">
            <img src="./img/p4.jpg" alt="Photo 4" class="gallery-img" onerror="this.src='https://via.placeholder.com/200x200/FF6347/FFFFFF?text=🌺'">
            <p class="photo-note">pap plengerr</p>
          </div>
          <div class="gallery-item">
            <img src="./img/p5.jpg" alt="Photo 5" class="gallery-img" onerror="this.src='https://via.placeholder.com/200x200/FF4500/FFFFFF?text=💝'">
            <p class="photo-note">pap imuttt</p>
          </div>
          <div class="gallery-item">
            <img src="./img/p6.jpg" alt="Photo 6" class="gallery-img" onerror="this.src='https://via.placeholder.com/200x200/FF6B6B/FFFFFF?text=🌟'">
            <p class="photo-note">mabarr roblox</p>
          </div>
        </div>
      </div>
    </div>

    <!-- SLIDE TUJUH - NOTE TAMBAHAN -->
    <div id="slideTujuh" class="d-none">
      <div class="paper animate__animated animate__zoomIn animate__slow">
        <div class="paper-content">
          <p id="teks3" class="teks"></p>
        </div>
      </div>
    </div>

    <p id="tap" class="d-none animate__animated animate__pulse text-muted animate__slow animate__repeat-3">Ketuk untuk melanjutkan</p>
    
    <!-- Footer yang sudah diperbaiki tagnya -->
    <footer class="page-footer font-small blue fixed-bottom"></footer>

  </div> <!-- Penutup div content -->

  <!-- Script dipindahkan ke bawah sebelum body tertutup -->
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
    integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous">
  </script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous">
  </script>
  <script src="https://kit.fontawesome.com/61e5120832.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/typeit@7.0.4/dist/typeit.min.js"></script>
  <script src="https://momentjs.com/downloads/moment.js"></script>
  <script src="https://momentjs.com/downloads/moment-with-locales.js"></script>
  <script src="https://momentjs.com/downloads/moment-timezone-with-data.js"></script>
  <script src="script.js"></script>
</body>

</html>
